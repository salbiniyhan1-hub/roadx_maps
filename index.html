<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            blue: '#00f0ff',
                            green: '#00ff66',
                            pink: '#ff0055',
                            yellow: '#ffe600',
                            dark: '#0a0d14',
                            panel: 'rgba(15, 23, 42, 0.75)',
                            panelLight: 'rgba(255, 255, 255, 0.85)'
                        }
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 15px rgba(0, 240, 255, 0.4)',
                        'neon-green': '0 0 15px rgba(0, 255, 102, 0.4)',

                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism visual elements */
        .glass-panel {
            background: rgba(10, 15, 28, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .light .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.15);
            color: #0f172a;
        }

        /* Map Container and Perspective transformations */
        #map-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center bottom;
        }

        /* 3D Tilt View Effect */
        .tilt-active #map {
            transform: rotateX(48deg) scale(1.15) translateY(-60px);
        }

        /* Dark mode custom Leaflet tile styling */
        .dark .leaflet-tile-pane {
            filter: brightness(0.7) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.4);
        }

        .leaflet-control-container .leaflet-routing-container-hide {
            display: none !important;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.5);
            border-radius: 3px;
        }

        /* Animated Pulsing GPS Marker */
        .user-marker-icon {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .user-marker-inner {
            width: 22px;
            height: 22px;
            background: #00f0ff;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f0ff;
            position: relative;
        }
        .user-marker-inner::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #00f0ff;
            animation: pulse-ring 1.8s infinite ease-out;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* Dynamic Vehicle Marker */
        .car-marker-container {
            transition: transform 0.2s linear;
        }
    </style>
</head>
<body class="bg-cyber-dark text-white h-screen w-screen relative overflow-hidden select-none">

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Preset Destinations for instant query selection
        const PRESET_LOCATIONS = [
            { name: "Kuala Lumpur City Centre", lat: 3.1579, lng: 101.7116, desc: "Capital City Landmark" },
            { name: "Shah Alam City Centre", lat: 3.0738, lng: 101.5183, desc: "Selangor Hub" },
            { name: "Penang Island (Georgetown)", lat: 5.4164, lng: 100.3327, desc: "Heritage City" },
            { name: "Singapore Marina Bay", lat: 1.2868, lng: 103.8545, desc: "Urban District" },
            { name: "Tokyo Shibuya Crossing", lat: 35.6595, lng: 139.7004, desc: "Tokyo City" },
            { name: "London Piccadilly Circus", lat: 51.5101, lng: -0.1342, desc: "UK Hub" }
        ];

        // Application State
        let map, userMarker, vehicleMarker, routePolyline;
        let currentPos = [3.1579, 101.7116]; // Default KL coordinates
        let destPos = null;
        let is3DTilt = true;
        let isNavigating = false;
        let simulationInterval = null;
        let voiceGuidance = true;
        let travelMode = 'driving';

        // Initialize Map & Application
        window.onload = function() {
            initMap();
            setupEventListeners();
            setupSpeech();
        };

        function initMap() {
            // Leaflet Map Initialization
            map = L.map('map', {
                center: currentPos,
                zoom: 16,
                zoomControl: false
            });

            // Modern Dark CartoDB Tile Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            // Add Custom Controls Position
            L.control.zoom({ position: 'topright' }).addTo(map);

            // User GPS Pulsing Marker
            const userIcon = L.divIcon({
                className: 'user-marker-icon',
                html: '<div class="user-marker-inner"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            userMarker = L.marker(currentPos, { icon: userIcon }).addTo(map)
                .bindPopup("<b>Current Location</b>").openPopup();

            // Map Click Event to set Destination
            map.on('click', function(e) {
                if (isNavigating) return;
                setDestination(e.latlng.lat, e.latlng.lng, `Custom Point (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`);
            });
        }

        function setupEventListeners() {
            // 3D Tilt Toggle
            document.getElementById('tilt-toggle-btn').addEventListener('click', function() {
                is3DTilt = !is3DTilt;
                const wrapper = document.getElementById('map-wrapper');
                const text = document.getElementById('tilt-text');
                if (is3DTilt) {
                    wrapper.classList.add('tilt-active');
                    text.innerText = "3D TILT";
                } else {
                    wrapper.classList.remove('tilt-active');
                    text.innerText = "2D FLAT";
                }
            });

            // Theme Toggle
            document.getElementById('theme-toggle-btn').addEventListener('click', function() {
                document.documentElement.classList.toggle('dark');
            });

            // Search Autocomplete
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const clearBtn = document.getElementById('clear-search');

            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase().trim();
                if (query.length > 0) {
                    clearBtn.classList.remove('hidden');
                    const filtered = PRESET_LOCATIONS.filter(item => item.name.toLowerCase().includes(query));
                    renderSearchResults(filtered);
                } else {
                    clearBtn.classList.add('hidden');
                    searchResults.classList.add('hidden');
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                searchResults.classList.add('hidden');
            });

            // Mode Selector
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.mode-btn').forEach(b => {
                        b.classList.remove('bg-cyan-500', 'text-slate-950', 'shadow-neon-cyan');
                        b.classList.add('text-gray-400');
                    });
                    this.classList.add('bg-cyan-500', 'text-slate-950', 'shadow-neon-cyan');
                    this.classList.remove('text-gray-400');
                    travelMode = this.dataset.mode;
                    if (destPos) calculateRoute();
                });
            });

            // Navigation Simulation Trigger
            document.getElementById('start-nav-btn').addEventListener('click', toggleNavigation);

            // Steps Drawer Toggle
            document.getElementById('steps-toggle-btn').addEventListener('click', () => {
                document.getElementById('steps-drawer').classList.remove('translate-x-full');
            });
            document.getElementById('close-steps-btn').addEventListener('click', () => {
                document.getElementById('steps-drawer').classList.add('translate-x-full');
            });

            // Voice Guidance Toggle
            document.getElementById('voice-toggle-btn').addEventListener('click', function() {
                voiceGuidance = !voiceGuidance;
                const icon = document.getElementById('voice-icon');
                icon.className = voiceGuidance ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark text-gray-500";
            });

            // GPS Simulation Switch
            document.getElementById('gps-toggle-btn').addEventListener('click', function() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        currentPos = [pos.coords.latitude, pos.coords.longitude];
                        userMarker.setLatLng(currentPos);
                        map.flyTo(currentPos, 16);
                        speakAlert("GPS location synchronized.");
                    }, () => {
                        alert("Geolocation request denied or unavailable. Using default location.");
                    });
                }
            });
        }

        function renderSearchResults(results) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            if (results.length === 0) {
                container.innerHTML = `<div class="p-3 text-xs text-gray-400 text-center">No locations found. Click anywhere on map to set route.</div>`;
            } else {
                results.forEach(loc => {
                    const item = document.createElement('div');
                    item.className = 'p-3 hover:bg-cyan-500/10 cursor-pointer flex items-center gap-3 transition';
                    item.innerHTML = `
                        <i class="fa-solid fa-location-dot text-cyan-400"></i>
                        <div>
                            <div class="text-xs font-bold text-white">${loc.name}</div>
                            <div class="text-[10px] text-gray-400">${loc.desc}</div>
                        </div>
                    `;
                    item.addEventListener('click', () => {
                        setDestination(loc.lat, loc.lng, loc.name);
                        container.classList.add('hidden');
                        document.getElementById('search-input').value = loc.name;
                    });
                    container.appendChild(item);
                });
            }
            container.classList.remove('hidden');
        }

        function setDestination(lat, lng, name) {
            destPos = [lat, lng];
            document.getElementById('dest-input').value = name;
            calculateRoute();
        }

        function calculateRoute() {
            if (!destPos) return;

            // Remove existing route line
            if (routePolyline) map.removeLayer(routePolyline);

            // Interpolate realistic route waypoint path
            const waypoints = generateSimulatedPath(currentPos, destPos);

            // Render neon route polyline
            routePolyline = L.polyline(waypoints, {
                color: '#00f0ff',
                weight: 6,
                opacity: 0.9,
                lineJoin: 'round'
            }).addTo(map);

            map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

            // Compute route distance & ETA metrics
            const distanceKm = (getDistance(currentPos, destPos) / 1000).toFixed(1);
            const speedKmH = travelMode === 'driving' ? 60 : (travelMode === 'cycling' ? 20 : 5);
            const durationMins = Math.round((distanceKm / speedKmH) * 60);

            document.getElementById('metric-dist').innerText = `${distanceKm} km`;
            document.getElementById('metric-time').innerText = `${durationMins} mins`;
            
            const etaTime = new Date(Date.now() + durationMins * 60000);
            document.getElementById('metric-eta').innerText = etaTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            document.getElementById('metrics-panel').classList.remove('hidden');
            document.getElementById('steps-toggle-btn').classList.remove('hidden');

            buildTurnInstructions(waypoints);
        }

        // Generate dynamic path waypoints
        function generateSimulatedPath(start, end) {
            const points = [start];
            const steps = 10;
            for (let i = 1; i < steps; i++) {
                const ratio = i / steps;
                const lat = start[0] + (end[0] - start[0]) * ratio + (Math.sin(i) * 0.003);
                const lng = start[1] + (end[1] - start[1]) * ratio + (Math.cos(i) * 0.003);
                points.push([lat, lng]);
            }
            points.push(end);
            return points;
        }

        function buildTurnInstructions(waypoints) {
            const stepsList = document.getElementById('steps-list');
            stepsList.innerHTML = '';
            
            const instructions = [
                "Head straight on main boulevard",

                "Continue straight for 1.5 km",

            ];

            instructions.forEach((inst, index) => {
                const step = document.createElement('div');
                step.className = 'bg-slate-900/60 p-2.5 rounded-xl border border-slate-800 flex items-center gap-3';
                step.innerHTML = `
                    <div class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-xs">
                        ${index + 1}
                    </div>
                    <div class="text-xs text-gray-200">${inst}</div>
                `;
                stepsList.appendChild(step);

        }

        function toggleNavigation() {
            if (!destPos) {
                alert("Please select a destination first!");
                return;
            }

            const btn = document.getElementById('start-nav-btn');
            const turnCard = document.getElementById('turn-card');

            if (isNavigating) {
                // Stop Navigation
                isNavigating = false;
                clearInterval(simulationInterval);
                if (vehicleMarker) map.removeLayer(vehicleMarker);
                btn.innerHTML = `<i class="fa-solid fa-play mr-1"></i> START SIMULATION`;
                turnCard.classList.add('hidden');
                document.getElementById('speedometer-val').innerText = '0';
                speakAlert("Navigation stopped.");
            } else {
                // Start Navigation Simulation
                isNavigating = true;
                btn.innerHTML = `<i class="fa-solid fa-square mr-1"></i> STOP SIMULATION`;
                turnCard.classList.remove('hidden');
                
                speakAlert("Starting navigation. Follow highlighted path.");
                startDrivingSimulation();
            }
        }

        function startDrivingSimulation() {
            const waypoints = routePolyline.getLatLngs();
            let index = 0;

            // Vehicle Marker Icon
            const carIcon = L.divIcon({
                className: 'car-marker-container',
                html: `<div class="w-8 h-8 rounded-full bg-slate-950 border-2 border-cyan-400 text-cyan-400 flex items-center justify-center shadow-neon-cyan transform -rotate-45">
                        <i class="fa-solid fa-location-arrow text-base"></i>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            vehicleMarker = L.marker(waypoints[0], { icon: carIcon }).addTo(map);

            simulationInterval = setInterval(() => {
                if (index >= waypoints.length - 1) {
                    clearInterval(simulationInterval);
                    isNavigating = false;
                    document.getElementById('start-nav-btn').innerHTML = `<i class="fa-solid fa-play mr-1"></i> START SIMULATION`;
                    document.getElementById('turn-instruction').innerText = "You have arrived at your destination!";
                    speakAlert("You have arrived at your destination!");
                    return;
                }

                const current = waypoints[index];
                const next = waypoints[index + 1];

                vehicleMarker.setLatLng(next);
                map.panTo(next, { animate: true, duration: 0.8 });

                // Update animated speedometer
                const simulatedSpeed = Math.floor(Math.random() * 15) + 55;
                document.getElementById('speedometer-val').innerText = simulatedSpeed;

                // Dynamic turn update prompts
                if (index === 2) {
                    updateTurnCard("In 150m, turn right onto Cyber Avenue", "fa-arrow-turn-down-right");
                    speakAlert("In 150 meters, turn right.");
                } else if (index === 5) {
                    updateTurnCard("In 300m, keep left towards express lane", "fa-arrow-left");
                    speakAlert("Keep left towards express lane.");
                }

                index++;
            }, 1200);

        function updateTurnCard(instruction, iconClass) {
            document.getElementById('turn-instruction').innerText = instruction;
            document.getElementById('turn-icon-box').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
        }

        // Distance formula between coordinates (Haversine)
        function getDistance(coord1, coord2) {
            const R = 6371e3;
            const lat1 = coord1[0] * Math.PI / 180;
            const lat2 = coord2[0] * Math.PI / 180;
            const deltaLat = (coord2[0] - coord1[0]) * Math.PI / 180;
            const deltaLng = (coord2[1] - coord1[1]) * Math.PI / 180;

            const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                      Math.cos(lat1) * Math.cos(lat2) *
                      Math.sin(deltaLng/2) * Math.sin(deltaLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Speech Synthesis Voice Alerts
        function setupSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        }

        function speakAlert(text) {
            if (!voiceGuidance || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
