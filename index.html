
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadX Maps</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#080d16;
  color:white;
  font-family:Arial,sans-serif;
}
header {
  padding:16px;
  background:#101a29;
  border-bottom:1px solid #26384d;
}
h2 { margin:0; color:#35e7ff; }
small { color:#a9bacd; }
#searchBox { padding:12px; position:relative; }
input, select, button {
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #31465d;
  background:#142033;
  color:white;
  margin-bottom:8px;
  font-size:15px;
}
button {
  background:#00bde8;
  color:#06111c;
  font-weight:bold;
  border:none;
}
#suggestions {
  background:#142033;
  border-radius:10px;
  overflow:hidden;
}
.suggestion {
  padding:12px;
  border-bottom:1px solid #31465d;
  cursor:pointer;
}
#map {
  height:53vh;
  width:100%;
  background:#0a1422;
}
#panel { padding:12px; }
.carMarker {
  font-size:32px;
  filter:drop-shadow(0 0 5px #00d9ff);
  text-align:center;
}
.status { color:#35e7ff; font-size:13px; }
</style>
</head>

<body>
<header>
  <h2>🚘 RoadX Maps</h2>
  <small>Explore your world • Find your route</small>
</header>

<div id="searchBox">
  <input id="destination"
    placeholder="🔎 Search destination or address"
    autocomplete="off">
  <div id="suggestions"></div>

  <select id="car">
    <option value="🚙">Toyota Alphard 🚙</option>
    <option value="🏎️">Sports Car 🏎️</option>
    <option value="🚗">Hatchback 🚗</option>
    <option value="🏍️">Motorcycle 🏍️</option>
  </select>

  <button onclick="useGPS()">📍 Use My Location</button>
  <button onclick="buildRoute()">🗺️ Find Route</button>
</div>

<div id="map"></div>

<div id="panel">
  <div class="status" id="status">Ready to navigate</div>
  <p id="details">Search for a destination to begin.</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([3.139,101.6869],13);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    attribution:'&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom:20
  }
).addTo(map);

let current = null;
let destinationPoint = null;
let carMarker = null;
let routeLine = null;
let destinationMarker = null;
let chosenPlace = null;
let searchTimer = null;

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function showCar(latlng) {
  const emoji = document.getElementById('car').value;
  const icon = L.divIcon({
    className:'',
    html:`<div class="carMarker">${emoji}</div>`,
    iconSize:[40,40],
    iconAnchor:[20,20]
  });

  if (!carMarker) {
    carMarker = L.marker(latlng,{icon}).addTo(map);
  } else {
    carMarker.setIcon(icon);
    carMarker.setLatLng(latlng);
  }
}

document.getElementById('car').addEventListener('change',()=>{
  if (current) showCar(current);
});

async function useGPS() {
  if (!navigator.geolocation) {
    setStatus('GPS is not supported by this browser.');
    return;
  }

  setStatus('Finding your location…');

  navigator.geolocation.getCurrentPosition(
    pos => {
      current = [pos.coords.latitude,pos.coords.longitude];
      showCar(current);
      map.setView(current,16);
      setStatus('GPS location found');
      document.getElementById('details').textContent =
        'Your current location is ready.';
    },
    err => setStatus(
      'Location unavailable. Allow location permission and use HTTPS.'
    ),
    {enableHighAccuracy:true,timeout:15000}
  );
}

document.getElementById('destination').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();

  if (q.length < 3) {
    document.getElementById('suggestions').innerHTML='';
    return;
  }

  searchTimer = setTimeout(()=>searchPlaces(q),500);
});

async function searchPlaces(q) {
  const box = document.getElementById('suggestions');
  box.innerHTML='<div class="suggestion">Searching…</div>';

  try {
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='
      +encodeURIComponent(q);

    const response=await fetch(url);
    const places=await response.json();

    box.innerHTML='';

    if (!places.length) {
      box.innerHTML='<div class="suggestion">No places found.</div>';
      return;
    }

    places.forEach(place=>{
      const item=document.createElement('div');
      item.className='suggestion';
      item.textContent=place.display_name;
      item.onclick=()=>{
        chosenPlace={
          lat:Number(place.lat),
          lon:Number(place.lon),
          name:place.display_name
        };
        document.getElementById('destination').value=place.display_name;
        box.innerHTML='';
        destinationPoint=[chosenPlace.lat,chosenPlace.lon];

        if (destinationMarker) map.removeLayer(destinationMarker);
        destinationMarker=L.marker(destinationPoint)
          .addTo(map).bindPopup(chosenPlace.name).openPopup();

        map.setView(destinationPoint,14);
        setStatus('Destination selected');
        document.getElementById('details').textContent =
          'Destination selected. Tap Find Route.';
      };
      box.appendChild(item);
    });
  } catch (error) {
    box.innerHTML=
      '<div class="suggestion">Search failed. Check your internet.</div>';
  }
}

async function buildRoute() {
  if (!current) {
    setStatus('First tap Use My Location.');
    return;
  }

  if (!destinationPoint) {
    setStatus('Please search and select a destination.');
    return;
  }

  setStatus('Calculating route…');

  try {
    const coords=
      `${current[1]},${current[0]};${destinationPoint[1]},${destinationPoint[0]}`;

    const url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`;

    const response=await fetch(url);
    const data=await response.json();

    if (!data.routes || !data.routes.length) {
      setStatus('No route found.');
      return;
    }

    const route=data.routes[0];

    if (routeLine) map.removeLayer(routeLine);

    routeLine=L.geoJSON(route.geometry,{
      style:{color:'#00d9ff',weight:6,opacity:0.9}
    }).addTo(map);

    map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
    showCar(current);

    const km=(route.distance/1000).toFixed(1);
    const mins=Math.round(route.duration/60);

    document.getElementById('details').textContent=
      `To: ${chosenPlace.name} • ${km} km • About ${mins} minutes`;

    setStatus('Route ready');
  } catch (error) {
    setStatus('Could not calculate route. Check your internet.');
  }
}

// Optional GPS tracking while the page stays open.
function startTracking() {
  if (!navigator.geolocation) return;

  navigator.geolocation.watchPosition(pos=>{
    current=[pos.coords.latitude,pos.coords.longitude];
    showCar(current);
  },()=>{},{
    enableHighAccuracy:true,
    maximumAge:3000
  });
}
</script>
</body>
</html>
