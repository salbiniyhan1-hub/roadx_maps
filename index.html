<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ROADX MAPS 3D</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #121212; }
    
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .header-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 12px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .header-bar h1 { font-size: 1.2rem; letter-spacing: 1px; }
    .header-bar h1 span { color: #00e5ff; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>ROAD<span>X</span> MAPS 3D</h1>
    <div id="status">● GPS READY</div>
  </div>

  <div id="map"></div>

  <script>
    // Initialize map centered at a default location
    const map = L.map('map').setView([3.1390, 101.6869], 13); // Default: Malaysia (KL)

    // Load guaranteed CartoDB Voyager tiles (No API key needed)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap & CartoDB'
    }).addTo(map);

    // Fix map rendering sizing
    window.addEventListener('load', () => {
      setTimeout(() => map.invalidateSize(), 300);
    });

    // Try live location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        map.setView([lat, lng], 15);
        L.marker([lat, lng]).addTo(map).bindPopup('You are here').openPopup();
      });
    }
  </script>
</body>
</html>
